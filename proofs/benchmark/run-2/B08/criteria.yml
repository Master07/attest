id: bench-b08
criteria:
  - id: pay-completes
    given: A cart with one item at /cart
    when: The user clicks "Pay"
    then: The Pay button is visible and clicking it shows an order number
    expect:
      url: /order-confirmation
      network: { method: POST, path: /api/pay, status: 200 }
      visible: ["Pay button"]
