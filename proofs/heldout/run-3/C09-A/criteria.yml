id: slide-status-kept-on-reinitialise-all-paths
# Written on 2026-11-03 from the bug report and the base build only, before any candidate branch
# was opened. Not to be edited after seeing a result; a change would be a new, numbered run.
# Run 3 (exploratory, after unsealing): one criterion per path the report names.
# The frozen criterion below was written before any candidate branch was opened; the added
# criteria were written after runs 1-2 without seeing labels, diffs or results.
criteria:
  - id: reinitialise-keeps-current-status
    given: >-
      The presentation is open on the slide headed "First slide", and the status text
      next to the buttons reads "1 / 3".
    when: >-
      The user clicks the "Next" button twice (the status reads "3 / 3" and the slide
      headed "Third slide" is visible), then clicks the "Initialize" button and waits.
    then: >-
      The status text still reads "3 / 3" and the slide headed "Third slide" is still
      the visible slide.
  - id: status-correct-after-subsequent-navigation
    given: >-
      The presentation is on the slide headed "Third slide" after the "Initialize"
      button was clicked.
    when: >-
      The user clicks the "Previous" button once and waits for the slide to settle.
    then: >-
      The slide headed "Second slide" is visible and the status text reads "2 / 3".
