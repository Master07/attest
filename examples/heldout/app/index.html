<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Presentation workspace</title><style>body{font:22px system-ui;background:#fafafa;color:#111}button,input,textarea{font:inherit;margin:8px;padding:8px}nav{position:fixed;left:10px;top:10px;z-index:10000;background:white;padding:8px}.step{width:750px;padding:40px;background:white}.substep{visibility:hidden}.substep-visible{visibility:visible}#impress-help{position:fixed;bottom:10px;background:white;z-index:20000;padding:15px}</style><style>.slide{padding:100px 60px}.slide:not(.deck-current){display:none}.deck-container{visibility:visible}</style><nav><button id="next">Next</button><button id="prev">Previous</button><button id="restart">Initialize</button><span class="deck-status-current">1</span> / <span class="deck-status-total">3</span></nav><main class="deck-container"><section class="slide" id="s1"><h1>First slide</h1><label>Input <input id="input"></label><label>Text area <textarea id="textarea"></textarea></label><div contenteditable="true" id="editor">Edit here</div></section><section class="slide" id="s2"><h1>Second slide</h1></section><section class="slide" id="s3"><h1>Third slide</h1></section></main><script src="jquery-1.7.min.js"></script><script src="core/deck.core.js"></script><script>$.deck(".slide");document.querySelector("#next").onclick=()=>$.deck("next");document.querySelector("#prev").onclick=()=>$.deck("prev");document.querySelector("#restart").onclick=()=>$.deck(".slide");window.ready=true;</script>
