<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Presentation workspace</title><style>body{font:22px system-ui;background:#fafafa;color:#111}button,input,textarea{font:inherit;margin:8px;padding:8px}nav{position:fixed;left:10px;top:10px;z-index:10000;background:white;padding:8px}.step{width:750px;padding:40px;background:white}.substep{visibility:hidden}.substep-visible{visibility:visible}#impress-help{position:fixed;bottom:10px;background:white;z-index:20000;padding:15px}</style><nav><button id="next">Next</button><button id="prev">Previous</button><button id="dismiss">Dismiss help</button></nav><div id="impress" data-transition-duration="0"><div class="step" id="s1" data-x="0" data-y="0"><h1>First slide</h1><p class="substep" id="f1">First point</p><p class="substep" id="f2">Second point</p><p class="substep" id="f3">Third point</p></div><div class="step" id="s2" data-x="1200" data-y="0"><h1>Second slide</h1><p class="substep" data-substep-order="1" id="g1">Grouped one</p><p class="substep" data-substep-order="1" id="g2">Grouped two</p></div></div><div id="impress-help"></div><script src="js/impress.js"></script><script>window.deck=impress();deck.init();document.querySelector("#next").onclick=()=>deck.next();document.querySelector("#prev").onclick=()=>deck.prev();document.querySelector("#dismiss").onclick=()=>document.querySelector("#impress-help").style.display="none";window.ready=true;</script>
