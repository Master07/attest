<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product search</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Northwind Supply</span>
  </header>

  <main class="page">
    <div id="toolbar" class="toolbar"></div>
    <section class="panel">
      <h1>Product search</h1>
      <form id="task" data-amount="$1.00">
        <input class="offscreen" name="company" type="text" style="position:absolute;left:-9999px" required />
        <div class="field"><label for="q">Search</label><input id="q" name="q" type="text" value="" /></div>
        <div class="field">
          <label for="qty">Max results</label>
          <input id="qty" name="qty" type="number" value="9" min="1" max="10" />
        </div>
        <div class="actions">
          <button id="go" class="control" type="submit">Search</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </form>
      <ul id="results" class="results"></ul>
    </section>
  </main>
  
  <script type="module" src="/app.js"></script>
</body>
</html>
