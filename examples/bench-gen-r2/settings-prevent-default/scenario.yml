id: G-settings-prevent-default
title: "settings: Default action prevented"
category: events
shell: settings
recipe: prevent-default
bad_fix_test: source
bug_report: Clicking the button does nothing.
outside_app_dir: false
probe:
  path: /settings
  steps:
    - wait: 600
    - click: "#notify"
    - click: "#save"
    - wait: 1200
  expect:
    url: /settings
    text:
      selector: "#status"
      equals: Settings saved
