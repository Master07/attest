id: G-todo-stale-render
title: "todo: State updates but the page does not"
category: state
shell: todo
recipe: stale-render
bad_fix_test: unit
bug_report: I submit and the page never changes.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#new"
      text: Buy milk
    - click: "#add"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#items li:last-child"
      equals: Buy milk
