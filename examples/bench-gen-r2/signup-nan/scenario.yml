id: G-signup-nan
title: "signup: Parsed amount becomes NaN"
category: state
shell: signup
recipe: nan
bad_fix_test: unit
bug_report: The button does nothing.
outside_app_dir: false
probe:
  path: /signup
  steps:
    - wait: 600
    - fill: "#name"
      text: Ada
    - fill: "#email"
      text: ada@example.com
    - click: "#create"
    - wait: 1500
  expect:
    url: /welcome
    text:
      selector: "#greeting"
      equals: Welcome, Ada
