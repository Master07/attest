id: G-settings-navigate-early
title: "settings: Navigation before the save finishes"
category: network
shell: settings
recipe: navigate-early
bad_fix_test: unit
bug_report: It sends me away before anything happens.
outside_app_dir: false
probe:
  path: /settings
  steps:
    - wait: 600
    - click: "#notify"
    - click: "#save"
    - wait: 1200
  expect:
    url: /settings
    text:
      selector: "#status"
      equals: Settings saved
