id: G-search-delayed-enable
title: "search: Control disabled shortly after load"
category: state
shell: search
recipe: delayed-enable
bad_fix_test: source
bug_report: The button goes grey after the page loads and I can't click it.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
