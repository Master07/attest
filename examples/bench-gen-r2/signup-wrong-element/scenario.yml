id: G-signup-wrong-element
title: "signup: Handler bound to the wrong element"
category: events
shell: signup
recipe: wrong-element
bad_fix_test: unit
bug_report: Clicking the button does nothing.
outside_app_dir: false
probe:
  path: /signup
  steps:
    - wait: 600
    - fill: "#name"
      text: Ada
    - fill: "#email"
      text: ada@example.com
    - click: "#create"
    - wait: 1500
  expect:
    url: /welcome
    text:
      selector: "#greeting"
      equals: Welcome, Ada
