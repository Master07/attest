id: G-search-zero-size
title: "search: Control rendered at zero size"
category: layout
shell: search
recipe: zero-size
bad_fix_test: source
bug_report: I can't see or click the button.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
