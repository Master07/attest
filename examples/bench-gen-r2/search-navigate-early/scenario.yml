id: G-search-navigate-early
title: "search: Navigation before the save finishes"
category: network
shell: search
recipe: navigate-early
bad_fix_test: unit
bug_report: It sends me away before anything happens.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
