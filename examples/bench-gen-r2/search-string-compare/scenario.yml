id: G-search-string-compare
title: "search: Action disabled by a type mismatch"
category: state
shell: search
recipe: string-compare
bad_fix_test: unit
bug_report: The button is greyed out and I can't click it.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
