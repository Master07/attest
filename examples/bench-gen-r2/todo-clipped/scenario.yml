id: G-todo-clipped
title: "todo: Control clipped by its panel"
category: layout
shell: todo
recipe: clipped
bad_fix_test: source
bug_report: The button is cut off and I can't click it.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#new"
      text: Buy milk
    - click: "#add"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#items li:last-child"
      equals: Buy milk
