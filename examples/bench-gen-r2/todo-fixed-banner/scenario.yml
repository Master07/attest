id: G-todo-fixed-banner
title: "todo: Fixed banner covers the control"
category: overlay
shell: todo
recipe: fixed-banner
bad_fix_test: source
bug_report: A banner covers the page and I can't use the button.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#new"
      text: Buy milk
    - click: "#add"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#items li:last-child"
      equals: Buy milk
