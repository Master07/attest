id: G-search-prevent-default
title: "search: Default action prevented"
category: events
shell: search
recipe: prevent-default
bad_fix_test: source
bug_report: Clicking the button does nothing.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
