id: G-signup-transparent-overlay
title: "signup: Transparent layer over the control"
category: overlay
shell: signup
recipe: transparent-overlay
bad_fix_test: source
bug_report: I can see the button but clicking it does nothing.
outside_app_dir: false
probe:
  path: /signup
  steps:
    - wait: 600
    - fill: "#name"
      text: Ada
    - fill: "#email"
      text: ada@example.com
    - click: "#create"
    - wait: 1500
  expect:
    url: /welcome
    text:
      selector: "#greeting"
      equals: Welcome, Ada
