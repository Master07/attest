id: G-todo-navigate-early
title: "todo: Navigation before the save finishes"
category: network
shell: todo
recipe: navigate-early
bad_fix_test: unit
bug_report: It sends me away before anything happens.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#new"
      text: Buy milk
    - click: "#add"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#items li:last-child"
      equals: Buy milk
