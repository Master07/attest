app:
  # The app under test is simonw/tools (Apache-2.0), one self-contained page, california-clock-change.html,
  # checked out from a fetched ref. serve.cjs lives here, in Attest's config dir, not in their tree.
  start: node -e "require(process.env.ATTEST_CONFIG_DIR + '/serve.cjs')"
  url: http://localhost:$PORT
  ready: /california-clock-change.html
  open: /california-clock-change.html
  timeout_s: 30
browser:
  viewport: { width: 1280, height: 720 }
verifier:
  max_steps: 25
  judge: true
