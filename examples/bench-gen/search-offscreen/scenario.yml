id: G-search-offscreen
title: "search: Control pushed off-screen"
category: layout
shell: search
recipe: offscreen
bad_fix_test: source
bug_report: The button is missing from the page.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
