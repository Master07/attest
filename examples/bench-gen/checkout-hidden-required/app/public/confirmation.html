<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Order confirmed</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar"><span class="brand">Northwind Supply</span></header>
  <main class="page">
    <section class="panel">
      <h1>Thank you</h1>
      <p class="order">Order <span id="order-number">#—</span></p>
      <a href="/cart">Back to the shop</a>
    </section>
  </main>
  <script>
    const order = new URLSearchParams(location.search).get("order");
    if (order) document.getElementById("order-number").textContent = "#" + order;
  </script>
</body>
</html>
