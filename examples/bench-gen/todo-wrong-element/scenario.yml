id: G-todo-wrong-element
title: "todo: Handler bound to the wrong element"
category: events
shell: todo
recipe: wrong-element
bad_fix_test: unit
bug_report: Clicking the button does nothing.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#new"
      text: Buy milk
    - click: "#add"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#items li:last-child"
      equals: Buy milk
