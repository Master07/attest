id: G-search-stale-render
title: "search: State updates but the page does not"
category: state
shell: search
recipe: stale-render
bad_fix_test: unit
bug_report: I submit and the page never changes.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
