id: G-todo-bad-redirect
title: "todo: Success goes to a missing page"
category: navigation
shell: todo
recipe: bad-redirect
bad_fix_test: unit
bug_report: After submitting I land on a page that doesn't exist.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#new"
      text: Buy milk
    - click: "#add"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#items li:last-child"
      equals: Buy milk
