id: G-todo-string-compare
title: "todo: Action disabled by a type mismatch"
category: state
shell: todo
recipe: string-compare
bad_fix_test: unit
bug_report: The button is greyed out and I can't click it.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#new"
      text: Buy milk
    - click: "#add"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#items li:last-child"
      equals: Buy milk
