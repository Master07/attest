id: G-search-wrong-element
title: "search: Handler bound to the wrong element"
category: events
shell: search
recipe: wrong-element
bad_fix_test: unit
bug_report: Clicking the button does nothing.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
