id: G-search-bad-redirect
title: "search: Success goes to a missing page"
category: navigation
shell: search
recipe: bad-redirect
bad_fix_test: unit
bug_report: After submitting I land on a page that doesn't exist.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
