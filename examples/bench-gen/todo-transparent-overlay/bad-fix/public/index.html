<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To-do list</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Northwind Supply</span>
  </header>

  <main class="page">
    <div id="toolbar" class="toolbar"></div>
    <section class="panel">
      <h1>To-do list</h1>
      <form id="task" data-amount="$1.00">
        <div class="field"><label for="new">New item</label><input id="new" name="new" type="text" value="" /></div>
        <div class="field">
          <label for="qty">Priority</label>
          <input id="qty" name="qty" type="number" value="9" min="1" max="10" />
        </div>
        <div class="actions">
          <button id="add" class="control" type="submit">Add</button>
        </div>
        <p id="status" class="status" role="status"></p>
      </form>
      <ul id="items" class="items"></ul>
    </section>
  </main>
    <div class="cover"></div>
  
  <script type="module" src="/app.js"></script>
</body>
</html>
