id: G-search-wrong-endpoint
title: "search: Request to a missing path"
category: network
shell: search
recipe: wrong-endpoint
bad_fix_test: unit
bug_report: I submit and get an error.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
