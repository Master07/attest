id: G-signup-hidden-required
title: "signup: Hidden required field blocks submit"
category: validation
shell: signup
recipe: hidden-required
bad_fix_test: source
bug_report: It won't let me submit the form.
outside_app_dir: false
probe:
  path: /signup
  steps:
    - wait: 600
    - fill: "#name"
      text: Ada
    - fill: "#email"
      text: ada@example.com
    - click: "#create"
    - wait: 1500
  expect:
    url: /welcome
    text:
      selector: "#greeting"
      equals: Welcome, Ada
