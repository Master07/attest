id: G-signup-clipped
title: "signup: Control clipped by its panel"
category: layout
shell: signup
recipe: clipped
bad_fix_test: source
bug_report: The button is cut off and I can't click it.
outside_app_dir: false
probe:
  path: /signup
  steps:
    - wait: 600
    - fill: "#name"
      text: Ada
    - fill: "#email"
      text: ada@example.com
    - click: "#create"
    - wait: 1500
  expect:
    url: /welcome
    text:
      selector: "#greeting"
      equals: Welcome, Ada
