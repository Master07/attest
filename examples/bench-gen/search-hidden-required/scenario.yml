id: G-search-hidden-required
title: "search: Hidden required field blocks submit"
category: validation
shell: search
recipe: hidden-required
bad_fix_test: source
bug_report: It won't let me submit the form.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
