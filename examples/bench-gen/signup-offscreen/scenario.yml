id: G-signup-offscreen
title: "signup: Control pushed off-screen"
category: layout
shell: signup
recipe: offscreen
bad_fix_test: source
bug_report: The button is missing from the page.
outside_app_dir: false
probe:
  path: /signup
  steps:
    - wait: 600
    - fill: "#name"
      text: Ada
    - fill: "#email"
      text: ada@example.com
    - click: "#create"
    - wait: 1500
  expect:
    url: /welcome
    text:
      selector: "#greeting"
      equals: Welcome, Ada
