id: G-search-clipped
title: "search: Control clipped by its panel"
category: layout
shell: search
recipe: clipped
bad_fix_test: source
bug_report: The button is cut off and I can't click it.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
