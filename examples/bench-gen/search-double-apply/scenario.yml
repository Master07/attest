id: G-search-double-apply
title: "search: Update applied twice"
category: state
shell: search
recipe: double-apply
bad_fix_test: unit
bug_report: I submit the form and the result is wrong.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#q"
      text: lamp
    - click: "#go"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#results li:first-child"
      equals: Desk lamp
