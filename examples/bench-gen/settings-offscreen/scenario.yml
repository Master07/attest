id: G-settings-offscreen
title: "settings: Control pushed off-screen"
category: layout
shell: settings
recipe: offscreen
bad_fix_test: source
bug_report: The button is missing from the page.
outside_app_dir: false
probe:
  path: /settings
  steps:
    - wait: 600
    - click: "#notify"
    - click: "#save"
    - wait: 1200
  expect:
    url: /settings
    text:
      selector: "#status"
      equals: Settings saved
