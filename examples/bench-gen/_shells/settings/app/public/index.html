<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="brand">Northwind Supply</span>
  </header>

  <main class="page">
    <div id="toolbar" class="toolbar"></div>
    <section class="panel">
      <h1>Settings</h1>
      <form id="task" data-amount="$1.00">
        <label class="check" for="notify"><input id="notify" type="checkbox" /> Email notifications</label>
        <div class="field">
          <label for="qty">Interval (minutes)</label>
          <input id="qty" name="qty" type="number" value="9" min="1" max="10" />
        </div>
        <button id="save" class="control" type="submit">Save</button>
        <p id="status" class="status" role="status"></p>
      </form>

    </section>
  </main>
  <!--@overlay-->
  <script type="module" src="/app.js"></script>
</body>
</html>
