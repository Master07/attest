id: G-settings-wrong-endpoint
title: "settings: Request to a missing path"
category: network
shell: settings
recipe: wrong-endpoint
bad_fix_test: unit
bug_report: I submit and get an error.
outside_app_dir: false
probe:
  path: /settings
  steps:
    - wait: 600
    - click: "#notify"
    - click: "#save"
    - wait: 1200
  expect:
    url: /settings
    text:
      selector: "#status"
      equals: Settings saved
