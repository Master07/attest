id: G-todo-double-apply
title: "todo: Update applied twice"
category: state
shell: todo
recipe: double-apply
bad_fix_test: unit
bug_report: I submit the form and the result is wrong.
outside_app_dir: false
probe:
  path: /
  steps:
    - wait: 600
    - fill: "#new"
      text: Buy milk
    - click: "#add"
    - wait: 1200
  expect:
    url: /
    text:
      selector: "#items li:last-child"
      equals: Buy milk
