id: G-settings-hidden-required
title: "settings: Hidden required field blocks submit"
category: validation
shell: settings
recipe: hidden-required
bad_fix_test: source
bug_report: It won't let me submit the form.
outside_app_dir: false
probe:
  path: /settings
  steps:
    - wait: 600
    - click: "#notify"
    - click: "#save"
    - wait: 1200
  expect:
    url: /settings
    text:
      selector: "#status"
      equals: Settings saved
