id: bench-b03
criteria:
  - id: pay-completes
    given: A cart with one item at /cart and the SAVE10 code applied
    when: The user clicks "Pay"
    then: The total shows $80.10 and the order confirmation page shows an order number
    expect:
      url: /order-confirmation
      network: { method: POST, path: /api/pay, status: 200 }
