id: B05
title: Email pattern blocks normal addresses
category: validation
bug_report: "I type my email, click Pay, and nothing happens."
outside_app_dir: false
probe:
  path: /cart
  steps:
    - { wait: 600 }
    - { fill: "#email", text: "buyer@example.com" }
    - { click: "#pay" }
    - { wait: 1500 }
  expect:
    url: /order-confirmation
