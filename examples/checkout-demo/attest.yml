app:
  install: npm install --no-audit --no-fund
  start: node server.js          # reads PORT from the environment
  url: http://localhost:$PORT
  ready: /cart                   # polled until it returns 200
  timeout_s: 30
browser:
  viewport: { width: 1280, height: 720 }
verifier:
  max_steps: 25
  judge: true
